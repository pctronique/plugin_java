plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
}

def versionProject = project.findProperty("PROJECT_VERSION")
def versionPctrmain = project.findProperty("PCTR_VERSION")
def versionImgRom = project.findProperty("IMGROM_VERSION")
def titleProject = project.findProperty("TITLE_PROJECT_PLUG1")
def nameJar = project.findProperty("NAME_JAR_PLUG1")
def javaFxVersion = project.findProperty("JAVAFX_VERSION")
def jsonVersion = project.findProperty("JSON_VERSION")
def ini4jVersion = project.findProperty("INI4J_VERSION")

repositories {
    ivy {
        url = 'https://pctronique.fr/'
        patternLayout {
            artifact 'data/program/[organisation]/[module]-[revision].jar'
            ivy 'data/program/[organisation]/ivy-[module]-[revision].xml'
        }
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JavaFX
    //implementation "org.openjfx:javafx-base:$javaFxVersion"
    //implementation "org.openjfx:javafx-controls:$javaFxVersion"
    //implementation "org.openjfx:javafx-graphics:$javaFxVersion"
    //implementation "org.openjfx:javafx-fxml:$javaFxVersion"

    //implementation "pctrmain:PctrMain:${versionPctrmain}"
    //implementation "pctrmainswing:PctrMainSwing:${versionPctrmain}"
    //implementation "loadimgrom:LoadImgRom:${versionImgRom}"

    // This dependency is used by the application.
    implementation libs.guava
    implementation project(':pctrplugin')
    //implementation "com.googlecode.json-simple:json-simple:$jsonVersion"
    //implementation "org.ini4j:ini4j:$ini4jVersion"
}

tasks.withType(JavaCompile) {
    options.deprecation = true
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:deprecation']
    options.compilerArgs += ['-Xlint:unchecked']
}

//javafx {
    //version = '21'
    // Ajoutez 'javafx.fxml' ici pour que le plugin l'inclue au classpath
    //modules = ['javafx.controls', 'javafx.fxml']
//}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// On configure explicitement la tâche JAR
tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': "$titleProject",
            'Implementation-Version': "$versionProject"
        )
    }
    // Force Gradle à inclure le Manifest même s'il pense que le JAR est modulaire
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = file("build/dist/lib")
    archiveFileName = "${nameJar}-${versionProject}.jar"
}
